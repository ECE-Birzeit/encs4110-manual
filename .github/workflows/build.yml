# Builds the manual on every change and publishes it.
#
#   pull request     -> build only, so a broken chapter is caught before it is merged
#   push to main     -> build, then commit the PDFs to the `pdf` branch (what the website's
#                       public/manual submodule points at; bump the submodule there to pick them up)
#   push a tag v*    -> build, then create a GitHub Release with the PDFs attached, e.g.
#                         git tag -a v1.1.0 -m "Fall 2026" && git push origin v1.1.0
#
# The PDFs of every run are also kept as a workflow artifact for 30 days.
name: Build manual

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v7

      # The svg package shells out to Inkscape to render the logo
      - name: Install Inkscape
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends inkscape make > /dev/null

      - name: Build every experiment and the full manual
        run: make all OUT=out

      - name: Check all 11 PDFs were written
        run: |
          ls -l out
          test "$(ls out/encs4110_*.pdf | wc -l)" -eq 11

      - name: Show LaTeX errors
        if: failure()
        run: grep -h -A3 '^!' *.log || true

      - uses: actions/upload-artifact@v7
        with:
          name: manual-pdfs
          path: out/*.pdf
          retention-days: 30

  publish-pdf-branch:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-pdf
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: pdf

      - uses: actions/download-artifact@v8
        with:
          name: manual-pdfs
          path: .

      - name: Commit and push to the pdf branch
        env:
          SOURCE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add encs4110_*.pdf
          if git diff --cached --quiet; then
            echo "PDFs unchanged"
            exit 0
          fi
          git commit -m "Build from ${GITHUB_SHA::7}: ${SOURCE_MESSAGE%%$'\n'*}"
          git push origin pdf

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: manual-pdfs
          path: out

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.pdf \
            --repo "$GITHUB_REPOSITORY" \
            --title "Lab manual $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
